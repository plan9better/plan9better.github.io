name: Deploy to GitHub Pages Repo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22

      - name: Install dependencies
        run: bun install

      - name: Build static export
        run: bun run build

      - name: Checkout build branch
        uses: actions/checkout@v4
        with:
          ref: build
          path: deploy

      - name: Replace contents with export
        run: |
          rm -rf deploy/*
          cp -R out/* deploy/
          cp -R out/.* deploy/ || true
        shell: bash

      - name: Commit and push
        run: |
          cd deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Deploy static site"
          git push
        shell: bash
